<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Гид по картам Hitman 3 — режим Фрилансер. Коды дверей и сейфов, оружие, инструменты с указанием местоположения." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="H3 Freelancer" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Hitman 3 — Гид Фрилансера</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" onclick="showList()">
        <div class="logo-icon">🎯</div>
        <div>
          <div class="logo-text">HITMAN 3</div>
          <div class="logo-sub">Гид Фрилансера</div>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          id="search"
          type="search"
          placeholder="Поиск по картам и предметам..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>
  </header>

  <main>
    <!-- LIST VIEW -->
    <div id="list-view">
      <div id="search-results" style="display:none; margin-bottom:16px;"></div>
      <div id="map-list"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detail-view" style="display:none">
      <button id="back-btn" class="back-btn">← Все карты</button>

      <div class="detail-header">
        <div id="detail-emoji" class="detail-emoji"></div>
        <div class="detail-title">
          <h1 id="detail-name"></h1>
          <div id="detail-subtitle" class="subtitle"></div>
          <div id="detail-region" class="region"></div>
          <div id="detail-mission" class="mission"></div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="codes" onclick="switchTab('codes')">🔑 Коды</button>
        <button class="tab-btn" data-tab="weapons" onclick="switchTab('weapons')">🔫 Оружие</button>
        <button class="tab-btn" data-tab="tools" onclick="switchTab('tools')">🔧 Инструменты</button>
        <button class="tab-btn" data-tab="zones" onclick="switchTab('zones')">🗺️ Зоны</button>
        <button class="tab-btn" data-tab="tips" onclick="switchTab('tips')">💡 Советы</button>
      </div>

      <div id="tab-codes" class="tab-content active"></div>
      <div id="tab-weapons" class="tab-content"></div>
      <div id="tab-tools" class="tab-content"></div>
      <div id="tab-zones" class="tab-content"></div>
      <div id="tab-tips" class="tab-content"></div>
    </div>
  </main>

  <!-- Zone Map Modal -->
  <div id="modal-overlay">
    <div id="modal-sheet">
      <div id="modal-header">
        <div>
          <div id="modal-type" class="modal-type-label"></div>
          <div id="modal-item-name" class="modal-item-name"></div>
          <div id="modal-item-location" class="modal-item-loc"></div>
          <div id="modal-zone-name" class="modal-zone-name"></div>
        </div>
        <button id="modal-close">✕</button>
      </div>
      <div id="modal-map-svg-wrap"></div>
      <div id="modal-zone-items" style="display:none"></div>
    </div>
  </div>

  <!-- PWA Install Banner -->
  <div id="install-banner" class="hidden">
    <div class="install-text">
      <div class="install-title">Установить приложение</div>
      <div class="install-sub">Работает офлайн, без браузера</div>
    </div>
    <button id="install-btn" class="install-btn">Установить</button>
    <button id="install-close" class="install-close">✕</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>

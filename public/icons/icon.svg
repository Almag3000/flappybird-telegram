  <rect x="256" y="96" width="80" height="80" fill="#f0d9b5"/>
  <rect x="336" y="96" width="80" height="80" fill="#b58863"/>
  <rect x="96" y="176" width="80" height="80" fill="#b58863"/>
  <rect x="176" y="176" width="80" height="80" fill="#f0d9b5"/>
  <rect x="256" y="176" width="80" height="80" fill="#b58863"/>
  <rect x="336" y="176" width="80" height="80" fill="#f0d9b5"/>
  <rect x="96" y="256" width="80" height="80" fill="#f0d9b5"/>
  <rect x="176" y="256" width="80" height="80" fill="#b58863"/>
  <rect x="256" y="256" width="80" height="80" fill="#f0d9b5"/>
  <rect x="336" y="256" width="80" height="80" fill="#b58863"/>
